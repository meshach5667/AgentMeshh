# Optional drop-in for the system Ollama service on the inference machine (docs: /docs/ai-agent).
#   sudo mkdir -p /etc/systemd/system/ollama.service.d
#   sudo cp ollama-agentmesh.conf /etc/systemd/system/ollama.service.d/agentmesh.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
# Review the limits for your machine first; they apply to everything Ollama runs.
[Service]
# Loopback only: Ollama has no authentication and must never be reachable from the network.
Environment=OLLAMA_HOST=127.0.0.1:11434
# One model, one request at a time, kept loaded between requests.
Environment=OLLAMA_MAX_LOADED_MODELS=1
Environment=OLLAMA_NUM_PARALLEL=1
Environment=OLLAMA_KEEP_ALIVE=30m
Environment=OLLAMA_CONTEXT_LENGTH=4096
# Leave room for the rest of the laptop: at most 6 of 8 hardware threads and 8 GB of RAM.
CPUQuota=600%
MemoryMax=8G
Nice=10
